# Integración continua: lint, formato, migraciones y pruebas en cada pull request a main.
# Nunca llama a OpenAI ni a WhatsApp: las pruebas usan el mock y el simulador.
name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: pytest y ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: traza
          POSTGRES_PASSWORD: traza
          POSTGRES_DB: traza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traza -d traza"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://traza:traza@localhost:5432/traza
      TEST_DATABASE_URL: postgresql+psycopg://traza:traza@localhost:5432/traza_test
      CLASSIFIER_PROVIDER: mock
      MESSAGE_COMPOSER: templates
      NOTIFICATION_PROVIDER: simulated

    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar SECRET_KEY de esta corrida
        run: |
          key=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$key"
          echo "SECRET_KEY=$key" >> "$GITHUB_ENV"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formato (ruff format --check)
        run: ruff format --check .

      - name: Una sola cabeza de migraciones (alembic heads)
        run: |
          alembic heads
          heads=$(alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "::error::Hay $heads cabezas de migración. Actualiza el down_revision de la migración más nueva (ver CONTRIBUTING.md)."
            exit 1
          fi

      - name: Crear la base de pruebas traza_test
        run: |
          python - <<'EOF'
          import psycopg

          with psycopg.connect("postgresql://traza:traza@localhost:5432/traza", autocommit=True) as conn:
              conn.execute("CREATE DATABASE traza_test OWNER traza")
          EOF

      - name: Pruebas (pytest)
        run: pytest -ra
