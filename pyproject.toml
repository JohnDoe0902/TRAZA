[project]
name = "traza"
version = "0.1.0"
description = "Registro, priorización y seguimiento de solicitudes de soporte TI de la FISI"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# Los nombres de errores de dominio vienen de CLAUDE.md (InvalidTransition, NotAuthorized...).
ignore = ["N818"]

[tool.ruff.lint.flake8-bugbear]
# Depends(...) en firmas de FastAPI es el uso previsto.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
