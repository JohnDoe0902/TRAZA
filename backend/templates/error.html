{% extends "base.html" %}
{% block title %}Error {{ status_code }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="alert alert-warning" role="alert">
      <h1 class="h5 alert-heading">
        {% if status_code == 403 %}Acceso denegado{% elif status_code == 404 %}No encontrado{% else %}No se pudo completar la operación{% endif %}
      </h1>
      <p class="mb-0">{{ message }}</p>
    </div>
    <a href="/tickets" class="btn btn-outline-secondary">Volver a mis tickets</a>
  </div>
</div>
{% endblock %}
